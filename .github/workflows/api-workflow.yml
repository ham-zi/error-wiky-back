name: Deploy Spring Boot App
# GitHub Actions 워크플로우 이름

on:
  push:
    branches: [main]
    # main 브랜치에 push가 발생하면 실행
  pull_request:
    branches: [main]
    # main 브랜치로 PR이 생성되거나 갱신되면 실행

jobs:
  build-and-Deploy:
    # 하나의 작업(Job) 이름
    runs-on: ubuntu-latest
    # Ubuntu 최신 환경에서 실행

    steps:
      - uses: actions/checkout@v4
        # GitHub 저장소의 코드를 Runner로 가져온다.

      - name: Setup Java
        # Java 개발 환경 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # Eclipse Temurin(OpenJDK) 배포판 사용
          java-version: "21"
          # Java 21 설치
          cache: "gradle"
          # Gradle 캐시를 사용하여 빌드 속도 향상

      - name: Grant execute permission for gradlew
        # gradlew 실행 권한 부여(Linux는 권한이 필요)
        run: chmod +x ./gradlew

      - name: Build with Gradle
        # 테스트를 제외하고 Spring Boot JAR 생성
        run: ./gradlew bootJar -x test

      - name: Verify Build output
        # JAR 파일이 정상 생성되었는지 확인
        run: |
          if [ ! -f build/libs/*.jar ]; then
            echo "빌드 실패 : JAR파일을 찾을 수 없습니다."
            exit 1
          fi
          echo "빌드 성공 : JAR파일이 생성되었습니다."

      - name: Deploy Boot App To EC2
        # push 이벤트에서만 EC2로 JAR 파일 전송
        if: github.event_name == 'push'
        uses: appleboy/scp-action@master
        # SCP를 이용하여 EC2로 파일 복사
        with:
          host: ${{ secrets.HOST }}
          # EC2 공인 IP 또는 도메인
          username: ${{ secrets.USERNAME }}
          # EC2 접속 계정(예: ubuntu)
          key: ${{ secrets.SSH_KEY }}
          # GitHub Secrets에 저장된 SSH 개인키
          source: "build/libs/*.jar"
          # 생성된 JAR 파일
          target: "/home/ubuntu/app"
          # EC2에 복사될 위치
          strip_components: 2
          # build/libs 경로를 제거하고 JAR 파일만 복사

      - name: Restart Container
        # 배포 후 Docker 컨테이너 재시작
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        # SSH로 EC2에 접속하여 명령 실행
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            # docker-compose.yml 위치로 이동
            docker compose restart back
            # back 컨테이너만 재시작하여 새 JAR 반영
